name: Build iOS IPA

on:
  push:
    branches: [ios-capacitor, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Disable code signing in Xcode project
        run: |
          cd ios/App
          # Patch the project to disable signing entirely
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*/DEVELOPMENT_TEAM = ""/g' App.xcodeproj/project.pbxproj
          # Add build settings to disable signing
          sed -i '' 's/"INFOPLIST_FILE"/"CODE_SIGNING_ALLOWED" = NO; "CODE_SIGNING_REQUIRED" = NO; "INFOPLIST_FILE"/g' App.xcodeproj/project.pbxproj

      - name: Build .app for generic iOS
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ runner.temp }}/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -40

      - name: Find and package IPA
        run: |
          echo "=== Searching for .app bundles ==="
          find "${{ runner.temp }}/build" -name "*.app" -type d 2>/dev/null || true
          
          # Try multiple known paths
          APP_PATH=""
          for p in \
            "${{ runner.temp }}/build/Build/Products/Release-iphoneos/App.app" \
            "${{ runner.temp }}/build/Build/Intermediates.noindex/ArchiveIntermediates/App/InstallationBuildProductsLocation/Applications/App.app" \
            ; do
            if [ -d "$p" ]; then
              APP_PATH="$p"
              break
            fi
          done
          
          # Fallback: find any .app
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "${{ runner.temp }}/build" -name "*.app" -type d | head -1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found. Build may have failed."
            echo "=== DerivedData contents ==="
            find "${{ runner.temp }}/build" -type d -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          mkdir -p "${{ runner.temp }}/ipa/Payload"
          cp -r "$APP_PATH" "${{ runner.temp }}/ipa/Payload/"
          cd "${{ runner.temp }}/ipa"
          zip -r "${{ runner.temp }}/Yuto.ipa" Payload
          echo "IPA created: $(ls -la ${{ runner.temp }}/Yuto.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuto-iOS
          path: ${{ runner.temp }}/Yuto.ipa
          retention-days: 30
