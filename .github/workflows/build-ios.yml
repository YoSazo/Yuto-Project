name: Build iOS IPA

on:
  push:
    branches: [ios-capacitor, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods (if needed)
        run: |
          cd ios/App
          if [ -f Podfile ]; then pod install; fi

      - name: Build app (unsigned)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ${{ runner.temp }}/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tail -30

      - name: Create IPA
        run: |
          APP_PATH="${{ runner.temp }}/build/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Searching all .app bundles..."
            find ${{ runner.temp }}/build -name "*.app" -type d
            APP_PATH=$(find ${{ runner.temp }}/build -name "*.app" -path "*/Release-iphoneos/*" -type d | head -1)
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p ${{ runner.temp }}/ipa/Payload
          cp -r "$APP_PATH" ${{ runner.temp }}/ipa/Payload/
          cd ${{ runner.temp }}/ipa
          zip -r ${{ runner.temp }}/Yuto.ipa Payload
          echo "IPA created successfully"
          ls -la ${{ runner.temp }}/Yuto.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuto-iOS
          path: ${{ runner.temp }}/Yuto.ipa
          retention-days: 30
