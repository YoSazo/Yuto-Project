name: Build iOS IPA

on:
  push:
    branches: [ios-capacitor, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for iOS Simulator (no signing needed)
        run: |
          cd ios/App
          # Use xcodeproj if no workspace exists
          if [ -d "App.xcworkspace" ]; then
            BUILD_CMD="-workspace App.xcworkspace"
          else
            BUILD_CMD="-project App.xcodeproj"
          fi
          xcodebuild build \
            $BUILD_CMD \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "${{ runner.temp }}/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64"

      - name: Build for iOS Device (unsigned)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            BUILD_CMD="-workspace App.xcworkspace"
          else
            BUILD_CMD="-project App.xcodeproj"
          fi
          xcodebuild build \
            $BUILD_CMD \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${{ runner.temp }}/build-device" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/device-build.log | tail -30
        continue-on-error: true

      - name: Package IPA
        run: |
          # Try device build first, fall back to simulator
          APP_PATH=$(find "${{ runner.temp }}/build-device" -name "App.app" -type d 2>/dev/null | head -1)
          BUILD_TYPE="device"
          
          if [ -z "$APP_PATH" ]; then
            echo "Device build not available, using simulator build"
            APP_PATH=$(find "${{ runner.temp }}/build" -name "App.app" -type d | head -1)
            BUILD_TYPE="simulator"
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in either build"
            find "${{ runner.temp }}/build" -type d -maxdepth 4 2>/dev/null
            exit 1
          fi
          
          echo "Using $BUILD_TYPE build: $APP_PATH"
          mkdir -p "${{ runner.temp }}/ipa/Payload"
          cp -r "$APP_PATH" "${{ runner.temp }}/ipa/Payload/"
          cd "${{ runner.temp }}/ipa"
          zip -r "${{ runner.temp }}/Yuto-AltStore.ipa" Payload
          echo "IPA created successfully"
          ls -la "${{ runner.temp }}/Yuto-AltStore.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: yuto-ios-build
          path: ${{ runner.temp }}/Yuto-AltStore.ipa
          retention-days: 30
