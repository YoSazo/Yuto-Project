name: Build iOS IPA

on:
  push:
    branches: [ios-capacitor, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Create self-signed certificate for ad-hoc build
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          KEYCHAIN_PASSWORD="temporary"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          
          # Create a self-signed certificate
          cat > ${{ runner.temp }}/cert.conf << EOF
          [req]
          distinguished_name = req_dn
          x509_extensions = v3_req
          prompt = no
          [req_dn]
          CN = iPhone Developer
          [v3_req]
          keyUsage = digitalSignature
          extendedKeyUsage = codeSigning
          EOF
          
          openssl req -x509 -newkey rsa:2048 -keyout ${{ runner.temp }}/key.pem -out ${{ runner.temp }}/cert.pem -days 365 -nodes -config ${{ runner.temp }}/cert.conf
          openssl pkcs12 -export -out ${{ runner.temp }}/cert.p12 -inkey ${{ runner.temp }}/key.pem -in ${{ runner.temp }}/cert.pem -passout pass:temp
          security import ${{ runner.temp }}/cert.p12 -k "$KEYCHAIN_PATH" -P temp -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Get the identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | awk -F'"' '{print $2}')
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "Using identity: $IDENTITY"

      - name: Build .app
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${{ runner.temp }}/build" \
            CODE_SIGN_IDENTITY="${{ env.SIGNING_IDENTITY }}" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_STYLE=Manual \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/build.log | tail -50
          
          echo "=== Build exit code: $? ==="

      - name: Debug build output (if failed)
        if: failure()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 /tmp/build.log
          echo "=== Searching for .app ==="
          find "${{ runner.temp }}/build" -name "*.app" -type d 2>/dev/null || echo "No build dir"

      - name: Package IPA
        run: |
          APP_PATH=$(find "${{ runner.temp }}/build" -name "*.app" -path "*Release-iphoneos*" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "${{ runner.temp }}/build" -name "*.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            find "${{ runner.temp }}/build" -type d -maxdepth 5
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p "${{ runner.temp }}/ipa/Payload"
          cp -r "$APP_PATH" "${{ runner.temp }}/ipa/Payload/"
          cd "${{ runner.temp }}/ipa"
          zip -r "${{ runner.temp }}/Yuto.ipa" Payload
          ls -la "${{ runner.temp }}/Yuto.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Yuto-iOS
          path: ${{ runner.temp }}/Yuto.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain ${{ runner.temp }}/build.keychain 2>/dev/null || true
